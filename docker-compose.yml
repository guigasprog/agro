# Compose pronto para o Coolify (build pack: Docker Compose)
# Acesso sem dominio: http://187.33.201.107:38456  (frontend Nginx -> /api -> backend)
services:
  db:
    image: postgis/postgis:15-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-sad_agricultura}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ./agro-clima
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: ${PORT:-8080}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-sad_agricultura}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://187.33.201.107:38456}
      API_SECURITY_TOKEN_SECRET: ${JWT_SECRET:-troque-esta-chave-por-uma-aleatoria}
    expose:
      - "8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./agro-clima-front
    depends_on:
      - backend
    ports:
      - "38456:80"
    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: ${PORT:-8080}
      API_URL: ""
      NGINX_ENVSUBST_FILTER: "BACKEND_"
    restart: unless-stopped

volumes:
  postgres_data:
